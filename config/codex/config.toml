personality = "pragmatic"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

notify = ["/Users/amtagrwl/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
mcp_oauth_credentials_store = "keyring"
approval_policy = "on-request"
# auto_review, not guardian_subagent. Same sandbox boundary as before — the
# writable roots below are unchanged and still bound what a job can touch. What
# changes is who answers an eligible approval request: it is reviewed
# automatically instead of parking until Amit happens to look. Delegated jobs
# stalled for most of 27-Jul waiting on approvals nobody was watching.
# Ref: learn.chatgpt.com/docs/agent-approvals-security#common-sandbox-and-approval-combinations
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

# Deliberately NOT danger-full-access. `workspace-write` plus an explicit
# writable root is the "ask me when it matters" posture, not blanket authority:
# Codex may write source repos and reach the network, and approval_policy
# "on-request" still gates anything outside that.
#
# Why this exists (27-Jul): every delegated implementation job failed with
# "readable but not writable" and DNS to scm.intermesh.net was unavailable.
# Cause was structural, not a bug — repos live in ~/git per the workspace
# contract, which is OUTSIDE the session cwd, and workspace-write blocks
# network by default. Diagnosis got done and no fix could ever be pushed.
[sandbox_workspace_write]
# ~/git only. The synced Workspace tree is intentionally absent: source never
# lives there, and a stray write inside it propagates to the other Mac.
writable_roots = ["/Users/amtagrwl/git"]
# Needed for git fetch/push and glab. Without it a job can diagnose but never
# publish, which is the exact failure this replaces.
network_access = true

